<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Primary Meta Tags - Will be updated dynamically -->
  <title>Blog Post | Image Paradise Photography</title>
  <meta name="description" content="Wedding photography tips, venue guides, and planning advice from Image Paradise Photography, Chennai.">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:url" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="https://image-paradise-photography.vercel.app/og-image.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://image-paradise-photography.vercel.app/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .post-page { padding: 8rem 4rem 5rem; max-width: 800px; margin: 0 auto; }
    .post-header { margin-bottom: 2rem; }
    .post-category { display: inline-block; background: var(--pk-pale); color: var(--pk); padding: 0.3rem 1rem; border-radius: 100px; font-size: 0.8rem; font-weight: 600; margin-bottom: 1rem; }
    .post-header h1 { font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.8rem); color: var(--ink); line-height: 1.3; margin-bottom: 1rem; }
    .post-meta { display: flex; gap: 1.5rem; color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    .post-meta span { display: flex; align-items: center; gap: 0.3rem; }
    .post-featured-image { width: 100%; border-radius: 16px; margin-bottom: 2rem; overflow: hidden; }
    .post-featured-image img { width: 100%; height: auto; display: block; }
    .post-content { line-height: 1.9; font-size: 1.05rem; color: #333; }
    .post-content h2 { font-family: var(--serif); font-size: 1.5rem; color: var(--ink); margin: 2rem 0 1rem; }
    .post-content h3 { font-family: var(--serif); font-size: 1.25rem; color: var(--ink); margin: 1.5rem 0 0.8rem; }
    .post-content p { margin-bottom: 1.2rem; }
    .post-content ul, .post-content ol { margin: 1rem 0 1.5rem 1.5rem; }
    .post-content li { margin-bottom: 0.5rem; }
    .post-content img { max-width: 100%; border-radius: 8px; margin: 1rem 0; }
    .post-content a { color: var(--pk); text-decoration: underline; }
    .post-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border); }
    .post-tag { background: var(--pk-pale); color: var(--pk); padding: 0.3rem 0.8rem; border-radius: 100px; font-size: 0.8rem; text-decoration: none; }
    .post-cta { background: var(--pk); color: white; padding: 2rem; border-radius: 16px; text-align: center; margin: 2rem 0; }
    .post-cta h3 { font-family: var(--serif); font-size: 1.4rem; margin-bottom: 0.5rem; }
    .post-cta p { opacity: 0.9; margin-bottom: 1rem; }
    .post-cta a { background: white; color: var(--pk); padding: 0.75rem 1.5rem; border-radius: 100px; font-weight: 600; text-decoration: none; }
    .related-posts { margin-top: 3rem; }
    .related-posts h3 { font-family: var(--serif); font-size: 1.5rem; margin-bottom: 1.5rem; }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .related-card { background: var(--pk-pale); border-radius: 12px; padding: 1rem; text-decoration: none; display: block; }
    .related-card:hover { transform: scale(1.02); }
    .related-card h4 { font-family: var(--serif); color: var(--ink); font-size: 1rem; margin-bottom: 0.3rem; }
    .related-card p { color: var(--muted); font-size: 0.85rem; margin: 0; }
    .breadcrumb { padding: 1rem 0; font-size: 0.9rem; color: var(--muted); }
    .breadcrumb a { color: var(--pk); text-decoration: none; }
    .post-loading { text-align: center; padding: 4rem; color: var(--muted); }
    .post-error { text-align: center; padding: 4rem; }
    .post-error h2 { color: var(--ink); margin-bottom: 1rem; }
    @media (max-width: 768px) {
      .post-page { padding: 6rem 1.5rem 3rem; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<header class="navbar" role="banner">
<nav id="nav" role="navigation" aria-label="Main navigation">
  <a href="/" class="brand" aria-label="Image Paradise Photography Home">
    <img src="images/Logo with Text Png.png" alt="Image Paradise Photography" width="150" height="30">
  </a>
  <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-menu" id="navMenu" role="menubar">
    <li role="none"><a href="/#portfolio" role="menuitem">Portfolio</a></li>
    <li role="none"><a href="/#about" role="menuitem">About</a></li>
    <li role="none"><a href="/#services" role="menuitem">Packages</a></li>
    <li role="none"><a href="/#testimonials" role="menuitem">Reviews</a></li>
    <li role="none"><a href="/#contact" class="nav-enquire" role="menuitem">Enquire Now</a></li>
  </ul>
</nav>
</header>

<main class="post-page">
  <!-- Breadcrumb -->
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="/">Home</a> &gt; <a href="/blog.html">Blog</a> &gt; <span id="postBreadcrumb">Loading...</span>
  </nav>

  <!-- Post Content -->
  <article id="postContent">
    <div class="post-loading">Loading article...</div>
  </article>

  <!-- CTA -->
  <div class="post-cta">
    <h3>Ready to Book Your Wedding Photographer?</h3>
    <p>Let's discuss your wedding plans and create beautiful memories together.</p>
    <a href="/#contact">Enquire Now</a>
  </div>

  <!-- Related Posts -->
  <section class="related-posts" id="relatedPosts">
    <h3>Related Articles</h3>
    <div class="related-grid" id="relatedGrid"></div>
  </section>
</main>

<button class="btt" id="btt" title="Back to top">↑</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Initialize Supabase client
  const supabaseUrl = 'https://kpfhkemgjzmopgxzrklx.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwZmhrZW1nanptb3BneHpya2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg0MTg1MjMsImV4cCI6MjA3Mzk5NDUyM30.OZv3x0R3tYIqx5z8mK_8dVWZ5JG3hOGZa3FhVLJ1XaE';

  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  // Get slug from URL
  const urlParams = new URLSearchParams(window.location.search);
  const postSlug = urlParams.get('slug');

  // Format date
  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-IN', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // Load post
  async function loadPost() {
    if (!postSlug) {
      document.getElementById('postContent').innerHTML = `
        <div class="post-error">
          <h2>Post Not Found</h2>
          <p>The requested article could not be found.</p>
          <a href="/blog.html" style="color: var(--pk);">← Back to Blog</a>
        </div>
      `;
      return;
    }

    const { data: post, error } = await supabase
      .from('blog_posts')
      .select(`
        id, title, slug, excerpt, content, featured_image, meta_title, meta_description,
        published_at, created_at, author_name,
        blog_categories (id, name, slug)
      `)
      .eq('slug', postSlug)
      .eq('published', true)
      .maybeSingle();

    if (error || !post) {
      document.getElementById('postContent').innerHTML = `
        <div class="post-error">
          <h2>Post Not Found</h2>
          <p>The requested article could not be found.</p>
          <a href="/blog.html" style="color: var(--pk);">← Back to Blog</a>
        </div>
      `;
      return;
    }

    // Update page meta tags
    document.title = post.meta_title || post.title + ' | Image Paradise Photography';
    document.querySelector('meta[name="description"]').content = post.meta_description || post.excerpt || '';
    document.querySelector('meta[property="og:title"]').content = post.title;
    document.querySelector('meta[property="og:description"]').content = post.meta_description || post.excerpt || '';
    document.querySelector('meta[property="og:url"]').content = 'https://image-paradise-photography.vercel.app/blog-post.html?slug=' + post.slug;

    // Update breadcrumb
    document.getElementById('postBreadcrumb').textContent = post.title;

    // Render post
    const categoryHtml = post.blog_categories
      ? `<span class="post-category">${post.blog_categories.name}</span>`
      : '';

    const imageHtml = post.featured_image
      ? `<div class="post-featured-image"><img src="${post.featured_image}" alt="${post.title}"></div>`
      : '';

    document.getElementById('postContent').innerHTML = `
      <header class="post-header">
        ${categoryHtml}
        <h1>${post.title}</h1>
        <div class="post-meta">
          <span>📅 ${formatDate(post.published_at || post.created_at)}</span>
          <span>✍️ ${post.author_name || 'Image Paradise Photography'}</span>
        </div>
      </header>
      ${imageHtml}
      <div class="post-content">
        ${post.content}
      </div>
      <!-- Schema.org Article markup -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "${post.title.replace(/"/g, '\\"')}",
        "description": "${(post.excerpt || '').replace(/"/g, '\\"')}",
        "author": { "@type": "Organization", "name": "Image Paradise Photography" },
        "datePublished": "${post.published_at || post.created_at}",
        "publisher": {
          "@type": "Organization",
          "name": "Image Paradise Photography",
          "logo": { "@type": "ImageObject", "url": "https://image-paradise-photography.vercel.app/images/Logo.png" }
        }
      }
      <\/script>
    `;

    // Load related posts
    loadRelatedPosts(post);
  }

  // Load related posts
  async function loadRelatedPosts(currentPost) {
    let query = supabase
      .from('blog_posts')
      .select('id, title, slug, excerpt, published_at')
      .eq('published', true)
      .neq('id', currentPost.id)
      .order('published_at', { ascending: false })
      .limit(3);

    if (currentPost.category_id) {
      query = query.eq('category_id', currentPost.category_id);
    }

    const { data: related, error } = await query;

    if (error || !related || related.length === 0) {
      document.getElementById('relatedPosts').style.display = 'none';
      return;
    }

    const html = related.map(post => `
      <a href="/blog-post.html?slug=${post.slug}" class="related-card">
        <h4>${post.title}</h4>
        <p>${formatDate(post.published_at)}</p>
      </a>
    `).join('');

    document.getElementById('relatedGrid').innerHTML = html;
  }

  // Initialize
  loadPost();
</script>
<script type="module" src="/script.js"></script>
</body>
</html>
