<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Booking Leads | Image Paradise Photography</title><link rel="icon" href="/favicon.png"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#24151d;background:#fff8fb;--pink:#d81b60;--line:#eadde3}*{box-sizing:border-box}body{margin:0}.top{background:#21131a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff}.wrap{width:min(1120px,calc(100% - 32px));margin:32px auto}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 32px #3210200c}.muted{color:#76636c}.field{display:grid;gap:7px;margin:14px 0}.field input{padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}.btn{background:var(--pink);color:#fff;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.hidden{display:none!important}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:125px}.stat b{display:block;font-size:1.4rem}.lead{border:1px solid var(--line);border-radius:13px;padding:16px;margin:12px 0;background:#fff}.lead-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.lead h3{margin:0}.lead-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:12px 0}.lead small{color:#76636c}.lead select,.lead textarea{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}.lead textarea{width:100%;min-height:65px}.error{color:#a01845}.success{color:#176b42}@media(max-width:600px){.top{padding:14px}.wrap{margin:18px auto}.panel{padding:17px}}
</style></head><body>
<header class="top"><strong>Image Paradise Photography · Booking Leads</strong><a href="/">View website ↗</a></header>
<main class="wrap">

</main>
