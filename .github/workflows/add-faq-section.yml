name: Add FAQ section

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-faq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add FAQ to homepage
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_link = '<link rel="stylesheet" href="faq.css">'
          if css_link not in s:
              s = s.replace('<link rel="stylesheet" href="style.css">', css_link + '\n  <link rel="stylesheet" href="style.css">', 1)

          nav_link = '<li role="none"><a href="#faq" role="menuitem">FAQ</a></li>'
          if nav_link not in s:
              marker = '<li role="none"><a href="#testimonials" role="menuitem">Reviews</a></li>'
              s = s.replace(marker, marker + '\n    ' + nav_link, 1)

          faq = r'''<!-- ══════════ FAQ ══════════ -->
          <section id="faq" aria-labelledby="faq-heading">
            <header class="sec-head">
              <div class="sec-badge" data-reveal="fade-up"><img src="images/Logo.png" alt="" aria-hidden="true">Frequently Asked Questions</div>
              <h2 id="faq-heading" data-reveal="fade-up" data-delay="80">Your questions, <em>answered</em></h2>
              <p data-reveal="fade-up" data-delay="160">Clear answers about wedding photography, packages, booking, delivery and pre-wedding sessions in Chennai.</p>
            </header>

            <div class="faq-wrap" data-reveal="fade-up" data-delay="180">
              <div class="faq-list">
                <details class="faq-item">
                  <summary><span class="faq-question"><span class="faq-qmark">01</span>What is the cost of wedding photography in Chennai?</span><span class="faq-plus" aria-hidden="true">+</span></summary>
                  <div class="faq-answer">Our listed wedding photography packages start at <strong>₹35,000</strong> for Essential coverage, <strong>₹75,000</strong> for Premium coverage, and <strong>₹1,50,000</strong> for Luxury coverage. The final package can vary based on coverage, photography and videography requirements, albums and additional sessions.</div>
                </details>

                <details class="faq-item">
                  <summary><span class="faq-question"><span class="faq-qmark">02</span>What areas do you serve for wedding photography?</span><span class="faq-plus" aria-hidden="true">+</span></summary>
                  <div class="faq-answer">Image Paradise Photography serves <strong>Chennai, Tiruvallur, Avadi and Ambattur</strong>, with coverage across Tamil Nadu and destination weddings. Travel arrangements for locations outside our regular service area can be discussed during enquiry.</div>
                </details>

                <details class="faq-item">
                  <summary><span class="faq-question"><span class="faq-qmark">03</span>How do I book Image Paradise Photography for my wedding?</span><span class="faq-plus" aria-hidden="true">+</span></summary>
                  <div class="faq-answer">Start by sending an enquiry with your <strong>name, WhatsApp number, location, session type and event date</strong>. We can then check date availability, discuss your photography requirements and recommend the package that fits your celebration.</div>
                </details>

                <details class="faq-item">
                  <summary><span class="faq-question"><span class="faq-qmark">04</span>What is included in your wedding photography packages?</span><span class="faq-plus" aria-hidden="true">+</span></summary>
                  <div class="faq-answer">Depending on the package, coverage can include photographers, videographers, edited photographs, printed albums, a private online gallery, digital downloads, pre-wedding or post-wedding sessions and a cinematic highlight video. The exact inclusions are shown in our package options.</div>
                </details>

                <details class="faq-item">
                  <summary><span class="faq-question"><span class="faq-qmark">05</span>How long does it take to receive wedding photos?</span><span class="faq-plus" aria-hidden="true">+</span></summary>
                  <div class="faq-answer">A preview selection is typically shared within <strong>24–48 hours</strong>. Full edited wedding galleries are generally delivered within <strong>4–6 weeks</strong>, while premium album design and printing may require additional time.</div>
                </details>

                <details class="faq-item">
                  <summary><span class="faq-question"><span class="faq-qmark">06</span>Do you offer pre-wedding shoots in Chennai?</span><span class="faq-plus" aria-hidden="true">+</span></summary>
                  <div class="faq-answer">Yes. We offer <strong>pre-wedding photography in Chennai</strong> with creative concepts and location-based sessions. Share your preferred style and date during enquiry so we can plan the shoot around your vision.</div>
                </details>

                <details class="faq-item">
                  <summary><span class="faq-question"><span class="faq-qmark">07</span>What is candid wedding photography?</span><span class="faq-plus" aria-hidden="true">+</span></summary>
                  <div class="faq-answer">Candid wedding photography focuses on genuine, natural moments rather than only posed photographs. The goal is to preserve real emotions, interactions, laughter and meaningful details from your wedding day.</div>
                </details>

                <details class="faq-item">
                  <summary><span class="faq-question"><span class="faq-qmark">08</span>Do your wedding packages include albums?</span><span class="faq-plus" aria-hidden="true">+</span></summary>
                  <div class="faq-answer">Yes. Our listed packages include printed album options, with the <strong>Premium</strong> package including two premium printed albums. Album specifications and design choices can be discussed when selecting your package.</div>
                </details>
              </div>
            </div>
          </section>
          '''

          if '<section id="faq"' not in s:
              s = s.replace('<!-- ══════════ CONTACT / ENQUIRY ══════════ -->', faq + '\n<!-- ══════════ CONTACT / ENQUIRY ══════════ -->', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit FAQ changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html faq.css
          if git diff --cached --quiet; then
            echo "FAQ already installed"
          else
            git commit -m "Add SEO-friendly FAQ section"
            git push
          fi
