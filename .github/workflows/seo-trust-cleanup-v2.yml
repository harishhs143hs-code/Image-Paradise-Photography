name: SEO Trust Cleanup v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch homepage safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            'Award-winning wedding photographer in Chennai with 6+ years experience. Candid photography, cinematic videography & pre-wedding shoots. Call +91 7708510143.': 'Wedding photographer in Chennai offering candid photography, cinematic videography and pre-wedding shoots. Call +91 7708510143.',
            'Award-winning wedding photographer in Chennai. 500+ weddings, 6+ years experience. Candid photography, cinematic films, pre-wedding shoots & luxury albums.': 'Candid wedding photography, cinematic wedding films and pre-wedding shoots in Chennai, Tiruvallur, Avadi and Ambattur.',
            'Award-winning wedding photographer in Chennai. 500+ weddings, candid photography, cinematic films, pre-wedding shoots.': 'Candid wedding photography, cinematic wedding films and pre-wedding shoots across Chennai and Tiruvallur.',
            'Award-winning wedding photographer in Chennai specializing in candid wedding photography, cinematic videography, pre-wedding shoots, bridal portraits and luxury album design. Serving Chennai, Tiruvallur, Avadi, Ambattur and across South India.': 'Wedding photographer in Chennai specializing in candid wedding photography, cinematic videography, pre-wedding shoots, bridal portraits and album design. Serving Chennai, Tiruvallur, Avadi, Ambattur and nearby locations.',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Remove fabricated rating schema only.
          s = re.sub(r'\s*"aggregateRating"\s*:\s*\{\s*"@type"\s*:\s*"AggregateRating".*?\n\s*\}\s*', '', s, flags=re.S)
          # Remove fabricated geographic coordinates.
          s = re.sub(r'\n\s*<meta name="geo\.position"[^>]*>', '', s)
          s = re.sub(r'\n\s*<meta name="ICBM"[^>]*>', '', s)
          # Remove fabricated LocalBusiness address/geo blocks while retaining the business schema.
          s = re.sub(r'\n\s*"address"\s*:\s*\{.*?\n\s*\},\s*\n\s*"geo"\s*:\s*\{.*?\n\s*\},', ',', s, flags=re.S)
          # Replace visible unsupported numeric trust claims with neutral labels.
          s = re.sub(r'<div class="hc"><span class="count" data-to="6">0</span><span>\+</span><label>Years Experience</label></div>', '<div class="hc"><span class="count">Real</span><label>Wedding Stories</label></div>', s)
          s = re.sub(r'<div class="hc"><span class="count" data-to="500">0</span><span>\+</span><label>Weddings Captured</label></div>', '<div class="hc"><span class="count">Candid</span><label>Wedding Photography</label></div>', s)
          s = re.sub(r'<div class="hc"><span class="count" data-to="1200">0</span><span>\+</span><label>Happy Clients</label></div>', '<div class="hc"><span class="count">Personal</span><label>Client Experience</label></div>', s)
          s = re.sub(r'<div class="hero-badge"[^>]*>.*?</div>\s*</div>', '<div class="hero-badge" aria-label="Wedding photography and cinematic films"><div class="badge-star" aria-hidden="true">✦</div><div><strong>Image Paradise</strong><span>Wedding Photography & Films</span></div></div></div>', s, count=1, flags=re.S)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate HTML and build
        run: |
          test -s index.html
          grep -q 'Wedding photographer in Chennai' index.html
          if grep -q 'aggregateRating' index.html; then echo 'aggregateRating still present'; exit 1; fi
          if grep -q 'Award-winning' index.html; then echo 'Unsupported award claim still present'; exit 1; fi
          npm ci
          npm run build

      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/seo-trust-cleanup-v2.yml
          git commit -m 'Clean homepage trust signals safely'
          git push
