name: Brand Search SEO Alignment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, '[site-audit]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Align homepage title, description, H1 and brand signals
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          title = 'Wedding Photographer Chennai | Image Paradise Photography'
          description = 'Wedding photography and cinematic wedding films in Chennai, Avadi and Tiruvallur. Explore candid, traditional and pre-wedding packages, real work and WhatsApp booking.'
          h1 = 'Wedding Photographer in Chennai — Candid & Cinematic Stories'

          s = re.sub(r'<title>.*?</title>', f'<title>{title}</title>', s, count=1, flags=re.S|re.I)
          s = re.sub(r'<meta name="title" content="[^"]*">', f'<meta name="title" content="{title}">', s, count=1, flags=re.I)
          s = re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{description}">', s, count=1, flags=re.I)
          s = re.sub(r'<meta property="og:title" content="[^"]*">', f'<meta property="og:title" content="{title}">', s, count=1, flags=re.I)
          s = re.sub(r'<meta property="og:description" content="[^"]*">', f'<meta property="og:description" content="{description}">', s, count=1, flags=re.I)
          s = re.sub(r'<meta name="twitter:title" content="[^"]*">', f'<meta name="twitter:title" content="{title}">', s, count=1, flags=re.I)
          s = re.sub(r'<meta name="twitter:description" content="[^"]*">', f'<meta name="twitter:description" content="{description}">', s, count=1, flags=re.I)

          def replace_h1(m):
              return f'<h1{m.group(1)}>{h1}</h1>'
          s, h1_count = re.subn(r'<h1([^>]*)>.*?</h1>', replace_h1, s, count=1, flags=re.S|re.I)
          if h1_count != 1:
              raise SystemExit(f'Expected exactly one homepage H1, changed {h1_count}')

          # Google recommends WebSite structured data with a concise preferred site name
          # and an alternate name when applicable.
          website_pattern = r'(<script type="application/ld\+json">\s*\{\s*"@context": "https://schema\.org",\s*"@type": "WebSite",)(.*?)(\n\s*\}\s*</script>)'
          def website_repl(m):
              block = m.group(0)
              block = re.sub(r'"name": "[^"]*"', '"name": "Image Paradise Photography"', block, count=1)
              if '"alternateName"' not in block:
                  block = block.replace('"name": "Image Paradise Photography",', '"name": "Image Paradise Photography",\n    "alternateName": ["Image Paradise", "imageparadisephotography.online"],', 1)
              block = block.replace('"url": "https://www.imageparadisephotography.online/search?q={search_term_string}"', '"url": "https://www.imageparadisephotography.online/search?q={search_term_string}"')
              return block
          s = re.sub(website_pattern, website_repl, s, count=1, flags=re.S|re.I)

          # Keep the Organization entity aligned with the same brand and real social profiles.
          org_start = s.find('"@type": "Organization"')
          if org_start >= 0:
              org_end = s.find('</script>', org_start)
              if org_end >= 0:
                  org = s[org_start:org_end]
                  if '"sameAs"' not in org:
                      org = org.replace('"contactPoint": {', '"sameAs": ["https://www.instagram.com/image_paradise_photography/", "https://www.linkedin.com/company/image-paradise/", "https://www.youtube.com/@imageparadisephotography6251"],\n    "contactPoint": {', 1)
                  org = org.replace('https://www.imageparadisephotography.online/images/Logo.png', 'https://www.imageparadisephotography.online/Logo.png')
                  s = s[:org_start] + org + s[org_end:]

          # Use the actual repository logo path in all homepage schema logo fields.
          s = s.replace('https://www.imageparadisephotography.online/images/Logo.png', 'https://www.imageparadisephotography.online/Logo.png')

          p.write_text(s, encoding='utf-8')

      - name: Commit SEO alignment
        shell: bash
        run: |
          git config user.name 'Image Paradise Site Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No SEO alignment changes required.'
            exit 0
          fi
          git commit -m '[site-audit] Align branded Google search signals'
          git push

      - name: Remove one-time workflow after successful alignment
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git rm .github/workflows/brand-search-seo.yml || true
          git config user.name 'Image Paradise Site Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[site-audit] Remove one-time brand SEO workflow' || true
          git push || true
