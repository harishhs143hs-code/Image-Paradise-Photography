name: Improve GEO content

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  improve-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Improve homepage content
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="geo-content.css">'
          if css not in s:
              s = s.replace('<link rel="stylesheet" href="style.css">', css + '\n  <link rel="stylesheet" href="style.css">', 1)
          if '<section id="photo-terms"' not in s:
              terms = r'''<!-- ══════════ PHOTOGRAPHY TERMS ══════════ -->
          <section id="photo-terms" aria-labelledby="photo-terms-heading">
            <header class="sec-head">
              <div class="sec-badge"><img src="images/Logo.png" alt="" aria-hidden="true">Photography Guide</div>
              <h2 id="photo-terms-heading">Wedding photography terms, <em>explained</em></h2>
              <p>Simple answers to common photography and videography terms.</p>
            </header>
            <div class="faq-wrap">
              <div class="faq-list">
                <details class="faq-item"><summary><span class="faq-question"><span class="faq-qmark">01</span>What is candid wedding photography?</span><span class="faq-plus" aria-hidden="true">+</span></summary><div class="faq-answer"><strong>Candid wedding photography</strong> is photography that captures natural moments as they happen. It focuses on real emotions, family interactions and genuine expressions instead of only posed photographs.</div></details>
                <details class="faq-item"><summary><span class="faq-question"><span class="faq-qmark">02</span>What is traditional wedding photography?</span><span class="faq-plus" aria-hidden="true">+</span></summary><div class="faq-answer"><strong>Traditional wedding photography</strong> is a planned style that includes posed portraits, family photographs and important ceremony moments. It helps ensure that key people and rituals are documented clearly.</div></details>
                <details class="faq-item"><summary><span class="faq-question"><span class="faq-qmark">03</span>What is cinematic wedding videography?</span><span class="faq-plus" aria-hidden="true">+</span></summary><div class="faq-answer"><strong>Cinematic wedding videography</strong> is a storytelling style that combines meaningful moments, creative shots, music and editing to create a short wedding film. It is designed to capture the feeling and story of the celebration.</div></details>
                <details class="faq-item"><summary><span class="faq-question"><span class="faq-qmark">04</span>What is a pre-wedding photoshoot?</span><span class="faq-plus" aria-hidden="true">+</span></summary><div class="faq-answer"><strong>A pre-wedding photoshoot</strong> is a photography session before the wedding. Couples can choose locations, outfits and concepts that reflect their relationship and personal style.</div></details>
                <details class="faq-item"><summary><span class="faq-question"><span class="faq-qmark">05</span>What is a wedding highlight video?</span><span class="faq-plus" aria-hidden="true">+</span></summary><div class="faq-answer"><strong>A wedding highlight video</strong> is a short edited film that presents selected moments from the wedding day. It usually focuses on emotions, important events and memorable details.</div></details>
              </div>
            </div>
          </section>
          '''
              pos = s.find('<section id="faq"')
              if pos != -1:
                  s = s[:pos] + terms + '\n' + s[pos:]
          guide = '<li role="none"><a href="#photo-terms" role="menuitem">Photography Guide</a></li>'
          if guide not in s:
              faq = '<li role="none"><a href="#faq" role="menuitem">FAQ</a></li>'
              if faq in s:
                  s = s.replace(faq, faq + '\n    ' + guide, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No GEO content changes needed"; else git commit -m "Improve GEO content with clear definitions and Q&A"; git push; fi
