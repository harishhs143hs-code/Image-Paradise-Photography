name: Apply DSC05261 fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crop image and update HTML
        run: |
          magick images/DSC05261.JPG -gravity South -crop 1263x1768+0+0 +repage -resize 1000x1400 -quality 90 images/DSC05261-cropped.jpg
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              pattern = re.compile(r'<img(?=[^>]*DSC05261)[^>]*>', re.I | re.S)
              def fix(m):
                  tag = m.group(0)
                  tag = re.sub(r'src=["\'][^"\']*DSC05261[^"\']*["\']', 'src="/images/DSC05261-cropped.jpg"', tag, flags=re.I)
                  if 'object-fit' not in tag:
                      tag = tag.replace('>', ' style="object-fit:cover;object-position:center bottom;">')
                  return tag
              fixed = pattern.sub(fix, s)
              if fixed != s:
                  p.write_text(fixed, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-dsc05261.yml .github/workflows/apply-dsc05261-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix DSC05261 image crop and display" || exit 0
          git push
