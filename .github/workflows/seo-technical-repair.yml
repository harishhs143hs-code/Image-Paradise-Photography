name: SEO Technical Repair

on:
  push:
    branches: [main]

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'Run SEO technical repair') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair homepage schema and lead hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"priceRange": "₹₹₹",,', '"priceRange": "₹₹₹",')
          s = s.replace('    ],}\n  </script>\n\n  <!-- Schema.org: Organization -->', '    ]\n  }\n  </script>\n\n  <!-- Schema.org: Organization -->')
          s = s.replace('class="whatsapp-float" target="_blank"', 'class="whatsapp-float" data-lead-event="whatsapp_click" target="_blank"')
          s = s.replace('href="tel:+917708510143"', 'href="tel:+917708510143" data-lead-event="phone_click"')
          s = s.replace('href="#contact"', 'href="#contact" data-lead-event="check_date_click"', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JSON-LD and build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', html, re.S)
          for i, block in enumerate(blocks, 1):
              json.loads(block)
          print(f'Validated {len(blocks)} JSON-LD blocks')
          PY
          npm install
          npm run build

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/seo-technical-repair.yml
          git add index.html .github/workflows/seo-technical-repair.yml
          git commit -m 'Run SEO technical repair' || exit 0
          git push
